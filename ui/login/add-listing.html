<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Listing - CampusShare</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-layout">
    
    <aside class="sidebar">
      <div class="brand">
        <i class="fa-solid fa-book-open"></i>
        <span>CampusShare</span>
      </div>

      <nav class="tabs">
        <a href="#" class="tab"><i class="fa-solid fa-chart-pie"></i> Analytics</a>
        <a href="#" class="tab"><i class="fa-solid fa-users"></i> Users</a>
        <a href="#" class="tab active"><i class="fa-solid fa-plus-circle"></i> Add Listing</a>
        <a href="#" class="tab"><i class="fa-solid fa-sliders"></i> Settings</a>
      </nav>
    </aside>

    <main class="main-content">
      
      <header class="top-header">
        <h2>Add Listing</h2>
        <div class="user-badge">
          Welcome, Adham
        </div>
      </header>

      <section class="form-card">
        <h3>New Book Information</h3>

        <form id="createListingForm" class="form-grid">
          
          <div class="form-row">
            <div class="field-group">
              <label for="title">Title</label>
              <input type="text" id="title" class="input-field" placeholder="Book title" required>
            </div>

            <div class="field-group">
              <label for="category">Category / Genre</label>
              <select id="category" class="input-field" required>
                <option value="">Select Genre</option>
                <option value="horror">Horror</option>
                <option value="fantasy">Fantasy</option>
                <option value="romance">Romance</option>
                <option value="scifi">Sci-Fi</option>
                <option value="mystery">Mystery & Thriller</option>
                <option value="non-fiction">Non-Fiction & Academic</option>
              </select>
            </div>
          </div>

          <div class="form-row">
            <div class="field-group">
              <label for="type">Listing Type</label>
              <select id="type" class="input-field" required>
                <option value="swap">Exchange</option>
                <option value="borrow">Borrow</option>
                <option value="sale">Sale</option>
              </select>
            </div>

            <div class="field-group">
              <label for="condition">Condition</label>
              <select id="condition" class="input-field" required>
                <option value="new">Like New</option>
                <option value="good">Good</option>
                <option value="used">Used</option>
              </select>
            </div>
          </div>

          <div class="field-group">
            <label for="description">Description</label>
            <textarea id="description" class="input-field" rows="4" placeholder="Write book summary or details here..." required></textarea>
          </div>

          <div class="field-group">
            <label for="image">Upload Cover Image</label>
            <input type="file" id="image" class="input-field" accept="image/*">
          </div>

          <div class="form-actions">
            <button type="submit" class="btn-submit"><i class="fa-solid fa-check"></i> Submit Book</button>
          </div>

        </form>
      </section>

    </main>

  </div>

  <script src="add-listing.js"></script>
</body>
</html>
