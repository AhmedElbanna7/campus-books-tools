<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Tools — Campus Books &amp; Tools Share</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="page">
  <header class="page-header">
    <h1>My Tools</h1>
    <p>Manage what you're sharing and keep track of what you've saved.</p>
  </header>

  <div class="tabs" role="tablist" aria-label="My tools sections">
    <button class="tab" id="tab-listings" role="tab" aria-selected="true" aria-controls="panel-content">
      My Listings <span class="tab-count" id="count-listings">0</span>
    </button>
    <button class="tab" id="tab-favorites" role="tab" aria-selected="false" aria-controls="panel-content">
      Favorites <span class="tab-count" id="count-favorites">0</span>
    </button>
  </div>

  <div class="toolbar" id="toolbar"></div>

  <div id="panel-content" role="tabpanel"></div>
</div>

<div class="toast-region" id="toast-region" aria-live="polite"></div>

<div class="modal-overlay" id="modal-overlay" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <button class="modal-close" id="modal-close" aria-label="Close">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M1 1l14 14M15 1L1 15" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    </button>
    <h2 id="modal-title">
      <svg viewBox="0 0 24 24" fill="none"><path d="M12 9v4m0 4h.01M10.3 3.9L2.6 17a1.8 1.8 0 001.5 2.7h15.8a1.8 1.8 0 001.5-2.7L13.7 3.9a1.8 1.8 0 00-3.4 0z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/></svg>
      Delete listing
    </h2>
    <p id="modal-body">Are you sure you want to delete this listing? This can't be undone.</p>
    <div class="modal-actions">
      <button class="btn btn-outline" id="modal-cancel">Cancel</button>
      <button class="btn btn-danger-solid" id="modal-confirm">Delete</button>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
